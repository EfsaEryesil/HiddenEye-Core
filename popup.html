<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HiddenEye Core</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #090a0f;
      --panel: #11131c;
      --border: #1e2230;
      --red: #ff2a4b;
      --red-dim: rgba(255, 42, 75, 0.1);
      --green: #10b981;
      --amber: #f59e0b;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }

    body {
      width: 380px;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: #c9d1d9;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      user-select: none;
    }

    .app-header { background: var(--panel); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .brand-section { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 18px; height: 18px; }
    .brand-title { font-family: var(--font-mono); font-weight: 700; font-size: 14px; letter-spacing: 1px; color: #fff; }
    .sys-badge { font-family: var(--font-mono); font-size: 10px; color: var(--red); background: var(--red-dim); border: 1px solid rgba(255, 42, 75, 0.3); padding: 2px 6px; border-radius: 2px; }

    .target-bar { background: #0d0f17; padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 11px; color: #6e7681; }
    .target-bar span strong { color: #c9d1d9; }
    .score-badge { font-weight: 700; padding: 2px 8px; border-radius: 3px; color: #fff; font-size: 10px; }
    .score-a { background: #059669; }
    .score-b { background: #d97706; }
    .score-f { background: #dc2626; }

    .content-area { padding: 12px 16px; position: relative; min-height: 120px; max-height: 420px; overflow-y: auto; }

    #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0; gap: 14px; transition: opacity 0.4s ease, transform 0.4s ease; }
    .cyber-eye-container { position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
    .eye-ring { position: absolute; width: 100%; height: 100%; border: 2px solid transparent; border-top-color: var(--red); border-bottom-color: var(--red); border-radius: 50%; animation: eyeSpin 1.5s linear infinite; }
    .eye-icon { width: 32px; height: 32px; filter: drop-shadow(0 0 10px rgba(255, 42, 75, 0.8)); animation: eyePulse 1.2s ease-in-out infinite alternate; }
    @keyframes eyeSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes eyePulse { 0% { transform: scale(0.85); opacity: 0.6; } 100% { transform: scale(1.1); opacity: 1; } }
    .loading-text { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--red); text-shadow: 0 0 8px rgba(255, 42, 75, 0.4); }

    .tech-item { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid #3b82f6; padding: 10px 12px; margin-bottom: 8px; border-radius: 2px; animation: fadeIn 0.3s ease-in-out; cursor: pointer; transition: background 0.2s; }
    .tech-item:hover { background: #181b28; }
    .tech-item.vulnerable { border-left-color: var(--red); }
    .tech-item.outdated { border-left-color: var(--amber); }
    .tech-item.secure-waf { border-left-color: var(--green); }

    .tech-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .tech-name { font-weight: 600; font-size: 13px; color: #fff; }
    .tech-ver { font-family: var(--font-mono); font-size: 11px; color: #6e7681; background: #161a26; padding: 1px 5px; border: 1px solid var(--border); }
    .cve-status { font-family: var(--font-mono); font-size: 10px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-clean { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot-vuln { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .dot-outdated { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .dot-unknown { background: #6e7681; }

    .text-clean { color: var(--green); }
    .text-vuln { color: var(--red); font-weight: 700; }
    .text-outdated { color: var(--amber); font-weight: 600; }

    .cve-details-list { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-family: var(--font-mono); font-size: 10px; }
    .cve-detail-item { color: #9ca3af; margin-bottom: 4px; word-break: break-word; }
    .cve-detail-item a { color: var(--red); text-decoration: none; }
    .cve-detail-item a:hover { text-decoration: underline; }

    .footer-bar { padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .export-btn { background: transparent; border: 1px solid var(--red); color: var(--red); font-family: var(--font-mono); font-size: 10px; padding: 5px 12px; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
    .export-btn:hover { background: var(--red); color: #fff; box-shadow: 0 0 10px rgba(255, 42, 75, 0.4); }
    .empty-box { border: 1px solid var(--border); background: var(--panel); padding: 20px; text-align: center; font-family: var(--font-mono); color: #6e7681; }

    
    .disclaimer {
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: #6e7681;
      text-align: center;
      padding: 6px;
      background: #0d0f17;
      border-top: 1px solid var(--border);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="brand-section">
      <img src="icons/icon.png" class="brand-logo">
      <span class="brand-title">HIDDENEYE</span>
    </div>
    <span class="sys-badge">SEC-ENGINE</span>
  </div>

  <div class="target-bar">
    <span>SEC SCORE: <span id="sec-score" class="score-badge score-a">SECURE</span></span>
    <span>DETECTED: <strong id="tech-count">0</strong></span>
  </div>

  <div class="content-area">
    <div id="loading">
      <div class="cyber-eye-container">
        <div class="eye-ring"></div>
        <img src="icons/icon.png" class="eye-icon">
      </div>
      <div class="loading-text">FULL DEEP SCANNING...</div>
    </div>
    <div id="results"></div>
  </div>

  <div class="footer-bar">
    <button id="export-btn" class="export-btn">EXPORT REPORT (.JSON)</button>
  </div>
  
  
  <div class="disclaimer">
    ⚠️ For educational and defensive purposes only. Use responsibly.
  </div>

  <script src="popup.js"></script>
</body>
</html>
